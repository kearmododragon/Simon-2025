<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script/script.js" defer></script>
    <link rel="stylesheet" href="style/style.css"> 
    <title>Simon says</title>
</head>
<body>
    <div class="title">
        <h2>Welcome to Simon it!</h2>
        <h2>Copy the buttons in order to progress.</h2>
        <button class="start-btn">START</button>
    </div>
<div class="leaderboard">
    <h3>HIGH SCORES</h3>
    <div class="leaderboard-header">
        <span>Round</span>
        <span>Score</span>
        <span>Time</span>
    </div>
    <div class="leaderboard-body"></div>
</div>
    <div class="buttons">
        <button class="game-btn red">  </button>
        <button class="game-btn yellow">  </button>
        <button class="game-btn blue">  </button>
        <button class="game-btn green">  </button>
    </div>
    <div class="timer">
        <h1>00:00:00</h1>
        <h2 id="score"></h2>
    </div>
</body>
</html>
